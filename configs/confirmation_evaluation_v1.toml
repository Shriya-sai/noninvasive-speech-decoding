[experiment]
name = "confirmation_evaluation_v1"
status = "frozen_before_model_application"
evaluation_count = 1

[artifacts]
feature_bundle_sha256 = "f1ae8b6b9735b56e046309c527e9781c9fd678656feb44f9a270fdc6e052b857"
