[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noninvasive-speech-decoding"
version = "0.1.0"
description = "Reproduction and mechanistic audit of scaling in JapanEEG speech decoding."
authors = [{ name = "Shriya Sai" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mne>=1.9,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "silero-vad[onnx-cpu]==6.2.1",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
