<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Temporal lag curve for validation and locked confirmation</title>
  <desc id="desc">Mean reciprocal rank at minus 1000, minus 500, zero, plus 500 and plus 1000 milliseconds. Validation peaks at plus 500 milliseconds, while confirmation peaks at zero.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .axis, .grid { stroke: #8c959f; }
    .grid { opacity: .28; }
    .validation { stroke: #bf6a02; fill: #bf6a02; }
    .confirmation { stroke: #0969da; fill: #0969da; }
    .series { fill: none; }
    .reference { stroke: #57606a; }
    .null { stroke: #8250df; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .axis, .grid { stroke: #8b949e; }
      .validation { stroke: #ffa657; fill: #ffa657; }
      .confirmation { stroke: #58a6ff; fill: #58a6ff; }
      .reference { stroke: #b1bac4; }
      .null { stroke: #d2a8ff; }
    }
  </style>
  <text x="70" y="34" font-size="20" font-weight="600">Temporal alignment distinguishes validation from confirmation</text>
  <text x="70" y="58" font-size="13">Within-day acoustic retrieval · higher mean reciprocal rank is better</text>
  <line class="grid" x1="90" y1="400" x2="840" y2="400"/><text x="76" y="404" font-size="12" text-anchor="end">0.04</text>
  <line class="grid" x1="90" y1="342" x2="840" y2="342"/><text x="76" y="346" font-size="12" text-anchor="end">0.05</text>
  <line class="grid" x1="90" y1="284" x2="840" y2="284"/><text x="76" y="288" font-size="12" text-anchor="end">0.06</text>
  <line class="grid" x1="90" y1="226" x2="840" y2="226"/><text x="76" y="230" font-size="12" text-anchor="end">0.07</text>
  <line class="grid" x1="90" y1="168" x2="840" y2="168"/><text x="76" y="172" font-size="12" text-anchor="end">0.08</text>
  <line class="grid" x1="90" y1="110" x2="840" y2="110"/><text x="76" y="114" font-size="12" text-anchor="end">0.09</text>
  <line class="axis" x1="90" y1="420" x2="840" y2="420"/><line class="axis" x1="90" y1="105" x2="90" y2="420"/>
  <line class="reference" x1="90" y1="314" x2="840" y2="314" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="835" y="308" font-size="12" text-anchor="end">Confirmation reference 0.0549</text>
  <line class="null" x1="90" y1="267" x2="840" y2="267" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text x="835" y="261" font-size="12" text-anchor="end">Confirmation null 95th 0.0630</text>
  <polyline class="validation series" points="110,364 290,351 465,277 640,262 820,299" stroke-width="3" style="fill:none"/>
  <polyline class="confirmation series" points="110,294 290,266 465,113 640,271 820,335" stroke-width="3" style="fill:none"/>
  <g class="validation"><circle cx="110" cy="364" r="5"/><circle cx="290" cy="351" r="5"/><circle cx="465" cy="277" r="5"/><circle cx="640" cy="262" r="5"/><circle cx="820" cy="299" r="5"/></g>
  <g class="confirmation"><rect x="105" y="289" width="10" height="10"/><rect x="285" y="261" width="10" height="10"/><rect x="460" y="108" width="10" height="10"/><rect x="635" y="266" width="10" height="10"/><rect x="815" y="330" width="10" height="10"/></g>
  <text x="625" y="251" font-size="12" text-anchor="end">Validation peak 0.0638</text>
  <text x="477" y="124" font-size="12">Confirmation peak 0.0896</text>
  <g font-size="12" text-anchor="middle"><text x="110" y="441">−1000</text><text x="290" y="441">−500</text><text x="465" y="441">0</text><text x="640" y="441">+500</text><text x="820" y="441">+1000</text></g>
  <text x="465" y="466" font-size="13" text-anchor="middle">EEG shift relative to vocal audio (ms)</text>
  <text x="20" y="247" font-size="13" text-anchor="middle" transform="rotate(-90 20 247)">Mean reciprocal rank</text>
  <circle class="validation" cx="100" cy="76" r="5"/><text x="113" y="81" font-size="13">One-time validation</text>
  <rect class="confirmation" x="255" y="71" width="10" height="10"/><text x="272" y="81" font-size="13">Locked confirmation</text>
</svg>
